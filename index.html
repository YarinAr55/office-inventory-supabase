<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0 0 50px;
      background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 60%);
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      min-height: 100vh;
    }

      box-shadow: 0 10px 30px rgba(0,0,0,.3);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    h1 {

      font-size: 1.5rem;
    }

    .subtitle {

      font-size: .85rem;
    }

    #connectionStatus {

      font-weight: bold;
      color: #fbbf24;
    }

    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px;
    }

    .card {
      background: rgba(30,41,59,.9);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,.4);
      margin-bottom: 25px;

    }

    .section-title {

      display: grid;

    }

    .input-group {

      gap: 6px;
    }

      color: #cbd5e1;
      font-weight: 700;
    }

    input, select {

      border-radius: 8px;
      border: 1px solid rgba(99,102,241,.5);
      background: #0f172a;
      color: #fff;
      width: 100%;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #818cf8;
      box-shadow: 0 0 8px rgba(129,140,248,.3);
    }

    button {

    }

    .primary-btn {
      background: linear-gradient(135deg,#6366f1,#4f46e5);
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 12px;
      font-weight: bold;
      width: 100%;
    }

    .export-btn {
      background: linear-gradient(135deg,#10b981,#059669);
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: bold;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: rgba(30,41,59,.75);
      border-radius: 14px;
      padding: 18px;
      border: 1px solid rgba(51,65,85,.8);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .stat-card.clickable {
      cursor: pointer;
    }

    .stat-card.clickable:hover {
      border-color: #6366f1;
    }

    .stat-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(99,102,241,.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }

    .stat-label {
      font-size: .8rem;
      color: #94a3b8;
      display: block;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .filter-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 2;
    }

    .chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      flex: 3;
    }

    .chip {
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 20px;
      background: #1e293b;
      color: #94a3b8;
      white-space: nowrap;
    }

    .chip.active {
      background: #6366f1;
      color: white;
    }

    .grid-container {

    }

    .item-card {

      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
    }

    .item-name {
      font-size: 1.1rem;
      font-weight: bold;
    }

    .badge {
      display: inline-block;
      background: rgba(49,46,129,.7);
      color: #c7d2fe;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: .75rem;
      margin-top: 4px;
    }

    .ok-badge, .alert-badge {
      padding: 4px 7px;
      border-radius: 5px;
      font-size: .7rem;
      font-weight: bold;
    }

    .ok-badge {
      background: rgba(6,78,59,.7);
      color: #34d399;
    }

    .alert-badge {
      background: rgba(127,29,29,.7);
      color: #fca5a5;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: #94a3b8;
      font-size: .85rem;
    }

    .action-row {
      background: rgba(15,23,42,.6);
      padding: 10px;
      border-radius: 8px;
    }

    .action-inputs {
      display: flex;
      gap: 7px;
      margin-bottom: 7px;
    }

    .action-buttons {
      display: flex;
      gap: 7px;
    }

      border-radius: 6px;
      padding: 7px 9px;
      font-weight: 600;
    }

    .plus-btn {
      background: #10b981;
      color: white;
      border: 0;
    }

    .minus-btn {
      background: #ef4444;
      color: white;
      border: 0;
    }

    .edit-btn {
      background: rgba(99,102,241,.2);
      color: #a5b4fc;
      border: 1px solid rgba(99,102,241,.5);
    }

    .delete-btn {
      background: rgba(239,68,68,.15);
      color: #f87171;
      border: 1px solid rgba(239,68,68,.4);
    }

    .history-box {
      background: rgba(15,23,42,.7);
      border-radius: 8px;
      padding: 8px;
      font-size: .78rem;
      display: flex;
      justify-content: space-between;
      color: #cbd5e1;
    }
