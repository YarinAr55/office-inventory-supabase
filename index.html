<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מערכת ניהול מלאי חכמה</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0 0 50px;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 60%);
      color: #f8fafc;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 20px 40px;
      background: linear-gradient(
        135deg,
        rgba(30, 27, 75, 0.96),
        rgba(49, 46, 129, 0.96)
      );
      border-bottom: 1px solid rgba(99, 102, 241, 0.3);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .header-content {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.55rem;
    }

    p {
      margin: 0;
      color: #c7d2fe;
      font-size: 0.85rem;
    }

    #connectionStatus {
      margin-top: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #fbbf24;
    }

    .container {
      max-width: 1200px;
      margin: 22px auto;
      padding: 0 20px;
    }

    .card {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(99, 102, 241, 0.45);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      align-items: end;
      gap: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      color: #cbd5e1;
      font-size: 0.8rem;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      padding: 11px;
      border: 1px solid rgba(99, 102, 241, 0.5);
      border-radius: 8px;
      background: #0f172a;
      color: #fff;
      font-size: 0.92rem;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15);
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    .primary-btn {
      width: 100%;
      padding: 12px;
      border: 0;
