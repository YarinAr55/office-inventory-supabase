<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מערכת ניהול מלאי חכמה</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0 0 50px;
      background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 60%);
      color: #f8fafc;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, rgba(30,27,75,.96), rgba(49,46,129,.96));
      padding: 20px 35px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    .header-content {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .subtitle {
      color: #c7d2fe;
      font-size: .85rem;
      margin-top: 4px;
    }

    #status {
      font-size: .8rem;
      color: #fbbf24;
      margin-top: 7px;
      font-weight: bold;
    }

    .container {
      max-width: 1200px;
      margin: 22px auto;
      padding: 0 18px;
    }

    .card {
      background: rgba(30,41,59,.9);
      border: 1px solid rgba(99,102,241,.4);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: 0 10px 25px rgba(0,0,0,.35);
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px,1fr));
      gap: 12px;
      align-items: end;
    }

    .group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      color: #cbd5e1;
      font-size: .8rem;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 11px;
      border: 1px solid #475569;
      border-radius: 8px;
      background: #0f172a;
      color: white;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #818cf8;
    }

    button {
      cursor: pointer;
      font-family: inherit;
    }

    .primary-btn {
      padding: 11px;
      border: 0;
      border-radius: 8px;
      background: #6366f1;
      color: white;
      font-weight: bold;
    }

    .export-btn {
      padding: 10px 15px;
      border: 0;
      border-radius: 8px;
      background: #059669;
      color: white;
      font-weight: bold;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: rgba(30,41,59,.85);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 17px;
    }

    .stat-card.clickable {
      cursor: pointer;
    }

    .stat-card.clickable:hover {
      border-color: #6366f1;
    }

    .stat-label {
      font-size: .8rem;
      color: #94a3b8;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 800;
      margin-top: 5px;
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .search-box {
      flex: 1;
      min-width: 220px;
    }

    .chips {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 8px 12px;
      border-radius: 18px;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }

    .chip.active {
      background: #6366f1;
      color: white;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill,minmax(300px,1fr));
      gap: 15px;
    }

    .item-card {
      background: rgba(30,41,59,.9);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 15px;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid #334155;
      padding-bottom: 9px;
      margin-bottom: 10px;
    }

    .item-name {
      font-size: 1.08rem;
      font-weight: bold;
    }

    .badge {
      display: inline-block;
      margin-top: 5px;
      padding: 3px 7px;
      border-radius: 5px;
      background: #312e81;
      color: #c7d2fe;
      font-size: .72rem;
    }

    .status-ok {
      color: #34d399;
      font-weight: bold;
      font-size: .75rem;
    }

    .status-low {
      color: #f87171;
      font-weight: bold;
      font-size: .75rem;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin: 9px 0;
      color: #94a3b8;
      font-size: .85rem;
    }

    .qty {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .actions {
      background: #0f172a;
      padding: 9px;
      border-radius: 8px;
      margin: 10px 0;
    }

    .action-inputs,
    .action-buttons {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .plus-btn,
    .minus-btn,
    .edit-btn,
    .delete-btn,
    .save-btn,
    .cancel-btn {
      padding: 7px 9px;
      border-radius: 6px;
      font-weight: 600;
    }

    .plus-btn,
    .save-btn {
      background: #10b981;
      color: white;
      border: 0;
      flex: 1;
    }

    .minus-btn {
      background: #ef4444;
      color: white;
      border: 0;
      flex: 1;
    }

    .edit-btn {
      background: #3730a3;
      color: #c7d2fe;
      border: 1px solid #6366f1;
    }

    .delete-btn,
    .cancel-btn {
      background: #7f1d1d;
      color: #fecaca;
      border: 1px solid rgba(239,68,68,.4);
    }

    .history {
      background: #0f172a;
      padding: 8px;
      border-radius: 7px;
      font-size: .76rem;
      color: #cbd5e1;
      margin-top: 7px;
    }

    .edit-box {
      background: #0f172a;
      padding: 11px;
      border-radius: 9px;
      border: 1px solid #6366f1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .empty {
      text-align: center;
      grid-column: 1/-1;
      padding: 35px;
      color: #94a3b8;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-box {
      width: 90%;
      max-width: 550px;
      max-height: 80vh;
      overflow-y: auto;
      background: #1e293b;
      border: 1px solid #6366f1;
      border-radius: 14px;
      padding: 18px;
    }

    .modal-item {
      background: #0f172a;
      border: 1px solid rgba(239,68,68,.4);
      border-radius: 8px;
      padding: 11px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .toast {
      position: fixed;
      left: 20px;
      bottom: 20px;
      background: #059669;
      color: white;
      padding: 11px 16px;
      border-radius: 9px;
      z-index: 2000;
      font-weight: bold;
    }

    .toast.error {
      background: #dc2626;
    }

    @media(max-width:650px) {
      header { padding: 15px; }
      .container { padding: 0 10px; }

      .action-inputs,
      .action-buttons {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-content">
    <div>
      <h1>📦 ניהול מלאי חכם</h1>
      <div class="subtitle">מערכת מלאי משותפת בענן</div>
      <div id="status">🟡 מתחבר ל-Supabase...</div>
    </div>

    <button class="export-btn" type="button" onclick="exportCSV()">
      📥 ייצוא לאקסל
    </button>
  </div>
</header>

<div class="container">

  <div class="card">
    <div class="section-title">➕ הוספת פריט חדש למלאי</div>

    <form id="addForm" class="form">

      <div class="group">
        <label for="newName">שם הפריט</label>
        <input id="newName" required placeholder="לדוגמה: דפי A4">
      </div>

      <div class="group">
        <label for="newCategory">קטגוריה</label>
        <select id="newCategory">
          <option value="ציוד משרדי">ציוד משרדי</option>
          <option value="נייר ודפוס">נייר ודפוס</option>
          <option value="אחזקה וניקיון">אחזקה וניקיון</option>
          <option value="אחר">אחר</option>
        </select>
      </div>

      <div class="group">
        <label for="newQuantity">כמות התחלתית</label>
        <input id="newQuantity" type="number" min="0" value="0" required>
      </div>

      <div class="group">
        <label for="newMin">מינימום התראה</label>
        <input id="newMin" type="number" min="0" value="5">
      </div>
