<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>מערכת ניהול מלאי חכמה</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{
margin:0;
padding:0 0 50px;
background:radial-gradient(circle at top,#1e1b4b,#0f172a 60%);
color:#f8fafc;
font-family:'Inter','Segoe UI',Tahoma,Arial,sans-serif;
min-height:100vh
}
header{
background:linear-gradient(135deg,rgba(30,27,75,.9),rgba(49,46,129,.9));
padding:20px 40px;
position:sticky;
top:0;
z-index:100;
box-shadow:0 10px 30px #0005
}
.header-content{
max-width:1200px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:16px
}
h1{
font-size:1.5rem;
margin:0 0 4px
}
p{
color:#c7d2fe;
font-size:.85rem;
margin:2px 0
}
.container{
max-width:1200px;
margin:20px auto;
padding:0 20px
}
.card{
background:#1e293be6;
border-radius:16px;
padding:24px;
margin-bottom:25px;
border:2px solid #6366f166;
box-shadow:0 10px 25px #0006
}
.section-title{
font-size:1.2rem;
font-weight:700;
margin-bottom:16px
}
.form{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:14px;
align-items:end
}
.input-group{
display:flex;
flex-direction:column;
gap:6px
}
label{
font-size:.8rem;
color:#cbd5e1;
font-weight:700
}
input,select{
padding:12px;
border-radius:8px;
border:1px solid #6366f180;
font-size:.95rem;
background:#0f172ae6;
color:#fff;
width:100%
}
button{
cursor:pointer
}
button:disabled{
cursor:not-allowed;
opacity:.7
}
.primary-btn{
background:#6366f1;
color:#fff;
border:0;
border-radius:8px;
padding:12px;
font-weight:700;
width:100%
}
.export-btn{
background:#059669;
color:#fff;
border:0;
border-radius:8px;
padding:10px 16px
}
.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:16px;
margin-bottom:20px
}
.stat-card{
background:#1e293bb3;
border-radius:14px;
padding:18px;
border:1px solid #334155;
display:flex;
align-items:center;
gap:14px
}
.stat-card.clickable{
cursor:pointer
}
.stat-icon{
width:42px;
height:42px;
border-radius:10px;
background:#6366f126;
display:flex;
align-items:center;
justify-content:center;
font-size:1.2rem
}
.stat-label{
font-size:.8rem;
color:#94a3b8;
font-weight:600
}
.stat-value{
font-size:1.4rem;
font-weight:800
}
.filter-bar{
display:flex;
gap:12px;
margin-bottom:20px;
flex-wrap:wrap
}
.search-box{
flex:2
}
.chips{
display:flex;
gap:6px;
flex:3;
flex-wrap:wrap
}
.chip{
padding:8px 14px;
border-radius:20px;
background:#1e293b;
color:#94a3b8;
border:1px solid #334155
}
.chip.active{
background:#6366f1;
color:#fff
}
.grid-container{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
gap:16px
}
.item-card{
background:#1e293bd9;
border-radius:14px;
padding:16px;
border:1px solid #334155;
display:flex;
flex-direction:column;
gap:12px
}
.item-header{
display:flex;
justify-content:space-between;
align-items:flex-start;
border-bottom:1px solid #334155;
padding-bottom:10px
}
.badge{
background:#312e8199;
color:#c7d2fe;
padding:3px 8px;
border-radius:4px;
font-size:.75rem
}
.badge-warehouse{
background:#0284c799;
color:#e0f2fe;
padding:3px 8px;
border-radius:4px;
font-size:.75rem
}
.ok-badge,.alert-badge{
padding:3px 6px;
border-radius:4px;
font-size:.7rem;
font-weight:700
}
.ok-badge{
background:#064e3b99;
color:#34d399
}
.alert-badge{
background:#7f1d1d99;
color:#fca5a5
}
.item-row{
display:flex;
justify-content:space-between;
align-items:center;
font-size:.85rem;
color:#94a3b8;
gap:8px
}
.table-input{
padding:6px;
text-align:center;
font-size:.85rem
}
.action-row{
background:#0f172a80;
padding:8px;
border-radius:8px
}
.action-inputs,.action-buttons{
display:flex;
gap:6px;
margin-top:6px
}
.plus-btn,.minus-btn,.edit-btn,.delete-btn{
border-radius:6px;
padding:7px 9px;
font-weight:600
}
.plus-btn{
background:#10b981;
color:#fff;
border:0
}
.minus-btn{
background:#ef4444;
color:#fff;
border:0
}
.edit-btn{
background:#3730a3;
color:#c7d2fe;
border:1px solid #6366f1
}
.delete-btn{
background:#7f1d1d;
color:#fecaca;
border:1px solid #ef444466
}
.history-box{
background:#0f172ab3;
border-radius:8px;
padding:8px;
font-size:.75rem;
color:#cbd5e1;
display:flex;
justify-content:space-between
}
.edit-form-box{
background:#0f172ae6;
border:1px solid #6366f1;
border-radius:10px;
padding:12px;
display:flex;
flex-direction:column;
gap:8px
}
.modal-overlay{
position:fixed;
inset:0;
background:#0f172acc;
display:none;
align-items:center;
justify-content:center;
z-index:1000
}
.modal-overlay.active{
display:flex
}
.modal-content{
background:#1e293b;
border:1px solid #6366f166;
border-radius:16px;
width:90%;
max-width:550px;
max-height:80vh;
overflow:auto;
padding:18px
}
.modal-item{
background:#0f172a99;
border:1px solid #ef444466;
border-radius:8px;
padding:12px;
margin-top:8px;
display:flex;
justify-content:space-between;
gap:10px
}
.empty{
grid-column:1/-1;
text-align:center;
color:#64748b;
padding:30px
}
/* ===== היסטוריית הורדות ===== */
.month-summary{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}
.month-box{
background:#0f172ab3;
border:1px solid #334155;
border-radius:10px;
padding:10px;
text-align:center
}
.month-box .num{
display:block;
font-size:1.35rem;
font-weight:800;
margin-top:2px
}
.month-box .lbl{
font-size:.72rem;
color:#94a3b8
}
.month-box.out .num{color:#f87171}
.month-box.cnt .num{color:#a5b4fc}
.moves{
background:#0f172ab3;
border:1px solid #334155;
border-radius:10px;
font-size:.8rem
}
.moves summary{
cursor:pointer;
padding:10px 12px;
font-weight:700;
color:#c7d2fe;
list-style:none;
display:flex;
justify-content:space-between;
align-items:center
}
.moves summary::-webkit-details-marker{display:none}
.moves summary::after{content:'▾';transition:transform .2s}
.moves[open] summary::after{transform:rotate(180deg)}
.moves-body{
padding:0 12px 10px;
max-height:260px;
overflow:auto
}
.month-head{
position:sticky;
top:0;
background:#1e293b;
border-radius:6px;
padding:6px 8px;
margin:8px 0 4px;
display:flex;
justify-content:space-between;
font-size:.75rem;
color:#e2e8f0;
font-weight:700
}
.month-head span:last-child{color:#fca5a5;font-weight:600}
.move-row{
display:grid;
grid-template-columns:auto 1fr auto;
gap:10px;
align-items:center;
padding:6px 4px;
border-bottom:1px dashed #334155
}
.move-row:last-child{border-bottom:0}
.move-qty{
min-width:54px;
text-align:center;
padding:3px 8px;
border-radius:6px;
font-weight:800;
direction:ltr
}
.move-qty.out{background:#7f1d1d99;color:#fca5a5}
.move-qty.in{background:#064e3b99;color:#34d399}
.move-date{color:#e2e8f0}
.move-date small{color:#64748b;margin-right:6px}
.move-after{color:#94a3b8;font-size:.72rem;display:flex;align-items:center;gap:4px;white-space:nowrap}
.mv-btn{
background:#ffffff0d;
border:1px solid #ffffff1a;
border-radius:6px;
padding:2px 5px;
font-size:.72rem;
line-height:1;
opacity:.75
}
.mv-btn:hover{opacity:1;border-color:#7c6cff}
.mv-btn.del:hover{border-color:#f43f5e}
.moves-empty{color:#64748b;text-align:center;padding:8px}
.undo-btn{
width:100%;
background:transparent;
color:#fbbf24;
border:1px dashed #fbbf2499;
border-radius:8px;
padding:7px 10px;
font-size:.78rem;
font-weight:600
}
.undo-btn:hover{background:#fbbf2414}
.month-picker{
display:flex;
align-items:center;
gap:8px;
background:#1e293b;
border:1px solid #6366f180;
border-radius:10px;
padding:4px 10px
}
.month-picker label{white-space:nowrap}
.month-picker select{
border:0;
background:transparent;
padding:8px 4px;
font-weight:700;
width:auto
}
.month-picker select option{background:#0f172a}
.report-btn{
background:#0369a1;
color:#fff;
border:0;
border-radius:8px;
padding:10px 16px
}
@media(max-width:650px){
header{padding:15px}
.container{padding:0 10px}
.form{grid-template-columns:1fr}
.grid-container{grid-template-columns:1fr}
.action-inputs,.action-buttons{flex-direction:column}
}
/*
